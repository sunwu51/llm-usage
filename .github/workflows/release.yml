name: Release extension

on:
  push:
    branches: [master]
    paths: [manifest.json]

permissions:
  contents: write

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check manifest version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/check-release.mjs
      - name: Test
        if: steps.version.outputs.release == 'true'
        run: npm test
      - name: Build Chrome Web Store ZIP
        if: steps.version.outputs.release == 'true'
        run: python scripts/package.py
      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" "dist/llm-usage-v${VERSION}.zip" \
            --target "$GITHUB_SHA" --title "LLM Usage v${VERSION}" --generate-notes
