<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="src/ui.css">
  <title>Connected · LLM Usage</title>
</head>
<body class="login-success-page">
  <main class="success-card">
    <div class="brand"><img src="icons/logo.svg" width="34" height="34" alt=""><strong>LLM Usage</strong></div>
    <div class="success-mark" aria-hidden="true">✓</div>
    <h1 id="success-title">Connected</h1>
    <p id="success-message" class="muted">Your account is saved. Checking usage now.</p>
    <div class="success-actions">
      <button id="view-usage" type="button">View usage</button>
      <button id="close-page" type="button">Close page</button>
    </div>
  </main>
  <script type="module" src="src/login-success.js"></script>
</body>
</html>
